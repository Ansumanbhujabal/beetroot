[project]
name = "beatroot"
version = "0.1.0"
description = "AI meal planning and validation assistant with enforced model/validation boundaries"
authors = [
    { name = "Ansuman Bhujabal", email = "ansumanbhujabal1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langfuse>=4.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "litellm>=1.55",
    "numpy>=2",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "rich>=13",
    "tenacity>=9.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[project.scripts]
beatroot = "beatroot.cli.main:app"

[project.optional-dependencies]
# Qdrant stays OPTIONAL on purpose: the vector store sits behind a protocol
# with an in-memory NumPy implementation, and `QDRANT_URL` selects between
# them at runtime. Making it mandatory would contradict that design and add
# grpcio/protobuf to every install for a path most local runs never take.
# `container._build_vector_store` degrades to NumPy with a warning when the
# URL is set but the client is absent, so the optionality cannot strand a
# deployment.
#
# `langfuse` is deliberately NOT here any more. It was an extra, and a plain
# `uv sync` therefore produced an install where prompt management fell back
# to local files and tracing silently did nothing — while `.env` said
# Langfuse was configured. That is the "advertised but silently dropped"
# shape this codebase rejects elsewhere: the fallback exists for missing
# CREDENTIALS, which is a real runtime state, not for a missing library,
# which is just a broken install.
qdrant = [
    "qdrant-client>=1.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "T20", "PTH", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "langgraph.*", "qdrant_client.*", "langfuse.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/beatroot"]
omit = ["*/web/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
