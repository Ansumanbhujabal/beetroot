[project]
name = "beatroot"
version = "0.1.0"
description = "AI meal planning and validation assistant with enforced model/validation boundaries"
authors = [
    { name = "Ansuman Bhujabal", email = "ansumanbhujabal1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "litellm>=1.55",
    "numpy>=2",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "rich>=13",
    "tenacity>=9.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[project.scripts]
beatroot = "beatroot.cli.main:app"

[project.optional-dependencies]
qdrant = [
    "qdrant-client>=1.12",
]
obs = [
    "langfuse>=2.50",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "T20", "PTH", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "langgraph.*", "qdrant_client.*", "langfuse.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/beatroot"]
omit = ["*/web/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
