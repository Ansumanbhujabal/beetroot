# --- Trust-gate cases -------------------------------------------------------
# Added after mutation testing showed that disabling `gate()` entirely — the
# whole of Feature 2 — went UNNOTICED by this suite. Every prior case has
# complete catalog coverage, so nothing ever drove trust low enough to refuse.
#
# A `nutrient_range` constraint naming a nutrient the catalog does not track is
# vocabulary-valid (so it reaches trust scoring) but UNCHECKABLE, which drives
# constraint_completeness to 0. Composite lands at 0.575 — ABOVE the 0.55
# threshold — so these cases specifically exercise the CONJUNCTIVE VETO rather
# than the score, which is the part a weighted average alone would miss.

- id: g31_low_trust_uncheckable_nutrient
  family: low_trust
  query: "a balanced dinner"
  constraints:
    - {id: g1, kind: nutrient_range, severity: goal, value: [1.0, 20.0], nutrient: vitamin_d}
  expect_terminal: [ESCALATE]

- id: g32_low_trust_uncheckable_medical_nutrient
  family: low_trust
  query: "something light"
  constraints:
    - {id: m1, kind: nutrient_range, severity: medical, value: [0.0, 5.0], nutrient: cholesterol_mg}
  expect_terminal: [ESCALATE]

- id: g33_low_trust_does_not_fire_on_a_healthy_profile
  family: low_trust
  query: "something warm with rice"
  constraints:
    - {id: m1, kind: exclude_tag, severity: medical, value: peanut}
  expect_terminal: [COMMIT]
